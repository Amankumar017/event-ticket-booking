<header class="masthead">
  <a class="masthead__brand" routerLink="/">
    Seatly
    <span class="masthead__house">Prithvi Playhouse</span>
  </a>

  <nav class="masthead__account">
    @if (auth.user(); as user) {
      <a routerLink="/my-bookings" class="masthead__link">Your bookings</a>
      <span class="masthead__who">{{ user.displayName }}</span>
      <button type="button" class="masthead__link" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/sign-in" class="masthead__link">Sign in</a>
    }
  </nav>
</header>

<main class="page">
  <router-outlet />
</main>
