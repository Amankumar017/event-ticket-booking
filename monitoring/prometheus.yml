global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: seatly
    metrics_path: /actuator/prometheus
    static_configs:
      # The application runs on the host, not in this network, because during
      # development it is restarted far more often than the stack around it.
      # host.docker.internal is how a container reaches back out on Docker
      # Desktop; a deployment would name the service instead.
      - targets: ["host.docker.internal:8090"]
        labels:
          instance: seatly-local
