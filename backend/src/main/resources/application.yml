spring:
  application:
    name: seatly

  datasource:
    # Non-default host ports: Gatekeeper's stack already owns 6379/8080 locally,
    # and 5432 is often taken by a native Postgres install. See docker-compose.yml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:seatly}
    username: ${DB_USER:seatly}
    password: ${DB_PASSWORD:seatly}
    hikari:
      # Deliberately small. Seat booking is contention-heavy, and stage 5 measures
      # how lock waits behave when the pool is the bottleneck.
      maximum-pool-size: 10
      pool-name: seatly-cp

  jpa:
    # Flyway owns the schema. Hibernate is only allowed to check that its entity
    # mappings agree with the migrated tables, never to create or alter them.
    hibernate:
      ddl-auto: validate
    # Off by default here: leaving the session open for the whole request hides
    # lazy-loading mistakes behind the view layer instead of failing loudly.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  threads:
    virtual:
      enabled: true

seatly:
  security:
    # Overridden in every real deployment. A default that only works locally is
    # better than one that silently works in production.
    jwt-secret: ${JWT_SECRET:local-development-signing-key-change-me}
    # Short, because nothing can revoke a signed token before it expires.
    access-token-ttl: 15m
    # Long, because it is revocable, rotated on every use, and never leaves an
    # http-only cookie.
    refresh-token-ttl: 14d
    # Off locally so the cookie works over plain http; on everywhere else.
    cookie-secure: ${COOKIE_SECURE:false}

  payments:
    # Shared with the payment provider. Every webhook is signed with it, and an
    # unsigned callback is how a stranger confirms their own booking for free.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-development-webhook-secret}

  outbox:
    sweep-every: 10s

  hold:
    # How long a customer gets to pay. Long enough to find a card, short enough
    # that a hall is not held hostage by people who wandered off.
    ttl: 5m
    sweep-every: 30s
    batch-size: 200

  cors:
    # The Angular dev server. A deployment overrides this with its real origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      # Every series carries this, so one Grafana can watch several deployments.
      application: seatly

info:
  app:
    name: seatly
    description: Event ticket booking with seat-level concurrency control

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    org.flywaydb: info
