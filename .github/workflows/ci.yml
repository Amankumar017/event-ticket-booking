name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the badge can be refreshed without pushing anything.
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # No service containers here on purpose. The tests start their own
      # PostgreSQL and Redis through Testcontainers, which is the same thing
      # they do on a laptop -- one way of running them, not two.
      - name: Test
        working-directory: backend
        run: ./mvnw --batch-mode verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        working-directory: frontend
        run: npm run build
